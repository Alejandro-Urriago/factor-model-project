version: 2
sources:
  - name: factor_model
    database: FACTOR_MODEL_PROJECT
    schema: RAW
    description: Raw monthly factor and asset return data, loaded via COPY INTO.
    config:
      freshness:
        warn_after:
          count: 7
          period: day
        error_after:
          count: 30
          period: day
      loaded_at_field: _etl_loaded_at
    tables:
      - name: returns
        description: Wide-format monthly returns, one row per date, one column per factor/asset.
      - name: factor_lookup
        description: Lookup table mapping factor_name to its category and description.